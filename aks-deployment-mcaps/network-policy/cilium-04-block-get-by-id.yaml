## Cilium L7 Policy: Block GET-by-ID from customer-frontend (pod-to-pod)
## customer-frontend: allow list, create, update, delete — block GET /api/customers/{id}
## VNet (10.0.0.0/16): full access (no L7 filtering)
## Requires ACNS: az aks update --name aks-vk-with-cilium --resource-group azure-vk-rg --enable-acns
## Apply:  kubectl apply -f cilium-04-block-get-by-id.yaml
## Remove: kubectl delete -f cilium-04-block-get-by-id.yaml
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: block-customer-api-get-by-id
  namespace: dpworld
spec:
  endpointSelector:
    matchLabels:
      app: customer-api
  ingress:
    # customer-frontend pod-to-pod: allow all EXCEPT GET /api/customers/{id}
    - fromEndpoints:
        - matchLabels:
            app: customer-frontend
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: "/health"
              - method: GET
                path: "/api/customers$"
              - method: GET
                path: "/api/customers\\?.*"
              - method: POST
              - method: PUT
              - method: DELETE
              - method: PATCH
              - method: HEAD
              - method: OPTIONS
    # VNet traffic (AppGW, nodes, APIM): full access
    - fromCIDR:
        - "10.0.0.0/16"
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
