## Cilium L7 Policy: Block DELETE on customer-api from customer-frontend (pod-to-pod)
## customer-frontend proxies all API calls → customer-api (pod-to-pod)
## customer-frontend: allow GET, POST, PUT, PATCH — block DELETE
## VNet (10.0.0.0/16): full access (no L7 filtering)
## Requires ACNS: az aks update --name aks-vk-with-cilium --resource-group azure-vk-rg --enable-acns
## Apply:  kubectl apply -f cilium-01-block-delete.yaml
## Remove: kubectl delete -f cilium-01-block-delete.yaml
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: block-customer-api-delete
  namespace: dpworld
spec:
  endpointSelector:
    matchLabels:
      app: customer-api
  ingress:
    # customer-frontend pod-to-pod: allow all EXCEPT DELETE
    - fromEndpoints:
        - matchLabels:
            app: customer-frontend
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
          rules:
            http:
              - method: GET
              - method: POST
              - method: PUT
              - method: PATCH
              - method: HEAD
              - method: OPTIONS
    # VNet traffic (AppGW, nodes, APIM): full access
    - fromCIDR:
        - "10.0.0.0/16"
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
