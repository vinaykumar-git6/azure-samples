---
# Test client pod - for testing inter-pod connectivity
apiVersion: v1
kind: Pod
metadata:
  name: test-client
  namespace: netpol-demo
  labels:
    app: test-client
    role: client
spec:
  containers:
    - name: curl
      image: curlimages/curl:latest
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
