---
# Web-A: "Order Service" - Blue themed
apiVersion: v1
kind: Pod
metadata:
  name: web-a
  namespace: netpol-demo
  labels:
    app: web-a
    role: order-service
spec:
  containers:
    - name: web
      image: python:3.12-alpine
      command: ["python", "/app/server.py"]
      ports:
        - containerPort: 8080
      env:
        - name: APP_NAME
          value: "web-a"
        - name: APP_ROLE
          value: "Order Service"
        - name: APP_COLOR
          value: "#1a73e8"
      volumeMounts:
        - name: script
          mountPath: /app
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
  volumes:
    - name: script
      configMap:
        name: web-server-script
---
