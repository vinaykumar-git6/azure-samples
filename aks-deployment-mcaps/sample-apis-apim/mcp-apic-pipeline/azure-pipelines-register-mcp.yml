# ============================================================
#  azure-pipelines-register-mcp.yml
#
#  PURPOSE:
#    When a developer pushes changes to their MCP server repo,
#    this pipeline automatically registers / updates the API
#    definition in Azure API Center (APIC).
#
#  SETUP STEPS:
#    1. Create an Azure Service Connection in your ADO project
#       (Project Settings → Service Connections → Azure Resource Manager)
#       Name it "azure-apic-sc" (or update AZURE_SERVICE_CONNECTION below).
#
#    2. Grant the Service Principal "API Center Service Contributor"
#       (or "Contributor") on the APIC resource group.
#
#    3. Copy this file + register-to-apic.ps1 into your MCP server repo.
#
#    4. Update the variables section below for your repo/service.
#
#    5. Point SPEC_FILE to your OpenAPI / MCP spec file.
# ============================================================

trigger:
  branches:
    include:
      - main
      - master
  paths:
    include:
      - "**/*.json"          # catches openapi.json, mcp-spec.json, etc.
      - "**/*.yaml"
      - "**/*.yml"
    exclude:
      - "azure-pipelines*.yml"   # don't re-trigger on pipeline changes

# Optional: also run on PRs (validate only — skips the register step)
pr:
  branches:
    include:
      - main
      - master

# ── Variables ──────────────────────────────────────────────────────────────────
variables:
  # ---- Azure connection ---------------------------------------------------
  AZURE_SERVICE_CONNECTION: "azure-apic-sc"          # ADO service connection name
  AZURE_SUBSCRIPTION_ID:    "<YOUR-SUBSCRIPTION-ID>"

  # ---- APIC target -------------------------------------------------------
  APIC_SERVICE:    "vinayorg-apic"
  APIC_RG:         "azure-vk-rg"

  # ---- MCP Server details (one pipeline per MCP server) ------------------
  API_ID:          "weather-mcp"            # unique, URL-safe ID in APIC
  API_TITLE:       "Weather MCP Server"     # display name
  API_VERSION:     "v1"
  LIFECYCLE_STAGE: "development"            # design|development|testing|preview|production
  SPEC_FILE:       "openapi.json"           # relative path in the repo to the spec
  SPEC_FORMAT:     "openapi"                # openapi | asyncapi | other
  SPEC_VERSION:    "3.0.0"

# ── Stages ─────────────────────────────────────────────────────────────────────
stages:

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 1 — Validate the spec file
# ─────────────────────────────────────────────────────────────────────────────
- stage: ValidateSpec
  displayName: "Validate OpenAPI Spec"
  jobs:
  - job: Validate
    displayName: "Lint & validate spec"
    pool:
      vmImage: "ubuntu-latest"

    steps:
    # Check the spec file exists
    - bash: |
        if [ ! -f "$(SPEC_FILE)" ]; then
          echo "##vso[task.logissue type=error]Spec file not found: $(SPEC_FILE)"
          exit 1
        fi
        echo "Spec file found: $(SPEC_FILE)"
      displayName: "Check spec file exists"

    # Validate JSON syntax (fast, no dependencies)
    - bash: |
        python3 -c "
        import json, sys
        try:
            with open('$(SPEC_FILE)') as f:
                data = json.load(f)
            print('JSON is valid')
        except json.JSONDecodeError as e:
            print(f'JSON parse error: {e}', file=sys.stderr)
            sys.exit(1)
        "
      displayName: "Validate JSON syntax"
      condition: endsWith(variables['SPEC_FILE'], '.json')

    # (Optional) Validate YAML syntax
    - bash: |
        python3 -c "
        import yaml, sys
        try:
            with open('$(SPEC_FILE)') as f:
                yaml.safe_load(f)
            print('YAML is valid')
        except yaml.YAMLError as e:
            print(f'YAML error: {e}', file=sys.stderr)
            sys.exit(1)
        "
      displayName: "Validate YAML syntax"
      condition: or(endsWith(variables['SPEC_FILE'], '.yaml'), endsWith(variables['SPEC_FILE'], '.yml'))

    # (Optional) Install and run Spectral for deeper OpenAPI linting
    # Uncomment if you want strict OpenAPI linting:
    #
    # - bash: npm install -g @stoplight/spectral-cli
    #   displayName: "Install Spectral linter"
    # - bash: spectral lint $(SPEC_FILE) --ruleset https://unpkg.com/@stoplight/spectral-owasp-ruleset/dist/ruleset.mjs
    #   displayName: "Run Spectral lint"

    - bash: echo "Spec validation passed"
      displayName: "Validation summary"


# ─────────────────────────────────────────────────────────────────────────────
# STAGE 2 — Register to Azure API Center
#   Runs only on main/master branch push (not on PRs)
# ─────────────────────────────────────────────────────────────────────────────
- stage: RegisterToAPIC
  displayName: "Register to API Center"
  dependsOn: ValidateSpec
  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

  jobs:
  - deployment: RegisterMCP
    displayName: "Register MCP to APIC"
    pool:
      vmImage: "ubuntu-latest"
    environment: "apic-$(LIFECYCLE_STAGE)"   # creates an ADO environment for approval gates

    strategy:
      runOnce:
        deploy:
          steps:
          # Checkout source (needed to access the spec file + the script)
          - checkout: self
            displayName: "Checkout source"

          # Log in to Azure using the service connection
          - task: AzureCLI@2
            displayName: "Register API in Azure API Center"
            inputs:
              azureSubscription: "$(AZURE_SERVICE_CONNECTION)"
              scriptType: "pscore"
              scriptLocation: "scriptPath"
              scriptPath: "$(Build.SourcesDirectory)/register-to-apic.ps1"
              # Pass all parameters in as script arguments
              arguments: >
                -ApiId           "$(API_ID)"
                -ApiTitle        "$(API_TITLE)"
                -SpecFile        "$(Build.SourcesDirectory)/$(SPEC_FILE)"
                -VersionId       "$(API_VERSION)"
                -ApicService     "$(APIC_SERVICE)"
                -ApicRg          "$(APIC_RG)"
                -LifecycleStage  "$(LIFECYCLE_STAGE)"
                -SpecFormat      "$(SPEC_FORMAT)"
                -SpecVersion     "$(SPEC_VERSION)"
                -CustomProperties '{"kind":"mcp"}'
            env:
              # AzureCLI task sets AZURE_SUBSCRIPTION_ID automatically;
              # explicit here for clarity
              AZURE_SUBSCRIPTION: "$(AZURE_SUBSCRIPTION_ID)"

          # Output a portal deep-link for the registered API
          - bash: |
              echo ""
              echo "============================================================"
              echo "  API registered successfully!"
              echo "  APIC service : $(APIC_SERVICE)"
              echo "  API ID       : $(API_ID)"
              echo "  Version      : $(API_VERSION)"
              echo "  Stage        : $(LIFECYCLE_STAGE)"
              echo ""
              echo "  Portal URL:"
              echo "  https://portal.azure.com/#view/Microsoft_Azure_ApiCenter/ResourceMenuBlade/~/apis/resourceId/%2Fsubscriptions%2F$(AZURE_SUBSCRIPTION_ID)%2FresourceGroups%2F$(APIC_RG)%2Fproviders%2FMicrosoft.ApiCenter%2Fservices%2F$(APIC_SERVICE)"
              echo "============================================================"
            displayName: "Print registration summary"
