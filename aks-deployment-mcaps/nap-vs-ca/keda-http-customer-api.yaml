# ---------------------------------------------------------------
# KEDA HTTP-based autoscaling for customer-api in dpworld namespace
#
# Cluster facts (from kubectl):
#   Deployment : customer-api          (label: app=customer-api)
#   Service    : customer-api-service  port 80 → targetPort 5000
#   Ingress    : customer-api-ingress  class: azure-application-gateway (AGIC)
#                no hostname rule — path-based only
#
# Prerequisites:
#   1. KEDA core installed via AKS add-on  ✓
#   2. KEDA HTTP Add-on installed via Helm:
#        helm repo add kedacore https://kedacore.github.io/charts
#        helm repo update
#        helm install http-add-on kedacore/keda-add-ons-http --namespace kube-system
#
# How traffic flows with AGIC + KEDA HTTP:
#   App Gateway → ExternalName svc (dpworld) → KEDA interceptor (kube-system)
#                                                      ↓ counts requests
#                                               customer-api pods
#
# Step 1: Apply this HTTPScaledObject
# Step 2: Apply the ExternalName service below
# Step 3: Update customer-api-ingress backend → keda-interceptor-proxy:8080
# ---------------------------------------------------------------

# ---------------------------------------------------------------
# HTTPScaledObject
# ---------------------------------------------------------------
apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: customer-api-http-scaler
  namespace: dpworld
spec:
  # No hostname on the ingress — use wildcard or actual AGIC public/private IP hostname
  # Update this if you add a host to your ingress later
  hosts:
    - "*"

  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: customer-api           # matches deployment name
    service: customer-api-service  # matches actual service name in dpworld
    port: 80                       # matches service port

  replicas:
    min: 1    # keep at 1 (not 0) since AGIC health probes need a live pod
    max: 20

  scaledownPeriod: 60
  targetPendingRequests: 100

---
# ---------------------------------------------------------------
# ExternalName Service — bridges AGIC (dpworld ns) to KEDA
# interceptor proxy (kube-system ns).
# Update customer-api-ingress to send traffic here instead of
# directly to customer-api-service.
# ---------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: keda-interceptor-proxy
  namespace: dpworld
spec:
  type: ExternalName
  # Adjust namespace below if KEDA HTTP add-on is in 'keda' instead of 'kube-system'
  externalName: keda-add-ons-http-interceptor-proxy.kube-system.svc.cluster.local
  ports:
  - port: 8080
    targetPort: 8080

