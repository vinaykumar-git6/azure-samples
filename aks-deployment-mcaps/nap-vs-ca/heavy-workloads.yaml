apiVersion: v1
kind: Namespace
metadata:
  name: app
---
# ---------------------------------------------------------------
# Workload 1: CPU-intensive prime number computation
# ---------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-stress
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpu-stress
  template:
    metadata:
      labels:
        app: cpu-stress
    spec:
      containers:
      - name: cpu-stress
        image: polinux/stress
        command: ["stress"]
        args: ["--cpu", "2", "-t", "3600s"]
        resources:
          requests:
            cpu: "1000m"
            memory: "256Mi"
          limits:
            cpu: "1500m"
            memory: "512Mi"
---
# ---------------------------------------------------------------
# Workload 2: Memory-intensive stress test
# ---------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-stress
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory-stress
  template:
    metadata:
      labels:
        app: memory-stress
    spec:
      containers:
      - name: memory-stress
        image: polinux/stress
        command: ["stress"]
        args: ["--vm", "1", "--vm-bytes", "512M", "--vm-keep", "-t", "3600s"]
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1000m"
            memory: "1500Mi"
---
# ---------------------------------------------------------------
# Workload 3: I/O and CPU stress (mixed load)
# ---------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: io-cpu-stress
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: io-cpu-stress
  template:
    metadata:
      labels:
        app: io-cpu-stress
    spec:
      containers:
      - name: io-cpu-stress
        image: polinux/stress
        command: ["stress"]
        args: ["--cpu", "1", "--io", "2", "--vm", "1", "--vm-bytes", "256M", "-t", "3600s"]
        resources:
          requests:
            cpu: "800m"
            memory: "512Mi"
          limits:
            cpu: "1500m"
            memory: "1Gi"
---
# ---------------------------------------------------------------
# Workload 4: Matrix computation (TensorFlow benchmark)
# ---------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-compute
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matrix-compute
  template:
    metadata:
      labels:
        app: matrix-compute
    spec:
      containers:
      - name: matrix-compute
        image: python:3.11-slim
        command: ["python3", "-c"]
        args:
        - |
          import time, math
          print("Starting heavy matrix computation...")
          while True:
              size = 1000
              a = [[math.sin(i*j) for j in range(size)] for i in range(size)]
              b = [[math.cos(i*j) for j in range(size)] for i in range(size)]
              c = [[sum(a[i][k]*b[k][j] for k in range(size)) for j in range(10)] for i in range(10)]
              print(f"Cycle complete: {c[0][0]:.4f}")
              time.sleep(1)
        resources:
          requests:
            cpu: "800m"
            memory: "512Mi"
          limits:
            cpu: "1500m"
            memory: "1Gi"
