apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-frontend
  namespace: dpworld
  labels:
    app: customer-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: customer-frontend
  template:
    metadata:
      labels:
        app: customer-frontend
    spec:
      containers:
        - name: customer-frontend
          image: acrvk012826.azurecr.io/customer-frontend:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: customer-frontend-svc
  namespace: dpworld
  labels:
    app: customer-frontend
spec:
  type: ClusterIP
  selector:
    app: customer-frontend
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: customer-frontend-ingress
  namespace: dpworld
  annotations:
    appgw.ingress.kubernetes.io/health-probe-path: "/health"
spec:
  ingressClassName: azure-application-gateway
  rules:
    - http:
        paths:
          - path: /portal
            pathType: Prefix
            backend:
              service:
                name: customer-frontend-svc
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: customer-frontend-svc
                port:
                  number: 80
          - path: /health
            pathType: Exact
            backend:
              service:
                name: customer-frontend-svc
                port:
                  number: 80
