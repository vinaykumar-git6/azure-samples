server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the customer-api service
    location /api/ {
        proxy_pass http://customer-api-service.dpworld.svc.cluster.local:80/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Proxy health endpoint
    location /health {
        proxy_pass http://customer-api-service.dpworld.svc.cluster.local:80/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Health check for the frontend itself
    location /nginx-health {
        access_log off;
        return 200 '{"status":"healthy","service":"customer-frontend"}';
        add_header Content-Type application/json;
    }
}
