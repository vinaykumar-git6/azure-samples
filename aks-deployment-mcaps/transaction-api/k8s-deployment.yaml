apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-api
  namespace: dpworld
  labels:
    app: transaction-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transaction-api
  template:
    metadata:
      labels:
        app: transaction-api
    spec:
      containers:
        - name: transaction-api
          image: acrvk012826.azurecr.io/transaction-api:latest
          ports:
            - containerPort: 5000
          env:
            - name: MONGO_HOST
              value: "mongodb-svc.dpworld.svc.cluster.local"
            - name: MONGO_PORT
              value: "27017"
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_PASS
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_INITDB_ROOT_PASSWORD
            - name: DB_NAME
              value: "transactiondb"
            - name: PORT
              value: "5000"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-api-svc
  namespace: dpworld
  labels:
    app: transaction-api
spec:
  type: ClusterIP
  selector:
    app: transaction-api
  ports:
    - port: 80
      targetPort: 5000
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transaction-api-ingress
  namespace: dpworld
  annotations:
    appgw.ingress.kubernetes.io/backend-path-prefix: "/"
    appgw.ingress.kubernetes.io/health-probe-path: "/health"
    appgw.ingress.kubernetes.io/use-private-ip: "true"
spec:
  ingressClassName: azure-application-gateway
  rules:
    - http:
        paths:
          - path: /txn
            pathType: Prefix
            backend:
              service:
                name: transaction-api-svc
                port:
                  number: 80
