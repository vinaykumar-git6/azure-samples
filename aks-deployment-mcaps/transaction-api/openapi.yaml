openapi: 3.0.3
info:
  title: Transaction Management API
  description: Simple API to manage financial transactions stored in MongoDB
  version: 1.0.0
  contact:
    name: Vinay Kumar

servers:
  - url: http://20.74.130.76/txn
    description: Production (App Gateway)
  - url: http://localhost:5000
    description: Local development

paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      tags: [Health]
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  database:
                    type: string
                    example: connected
        "503":
          description: Service is unhealthy

  /api/transactions:
    get:
      summary: List all transactions
      operationId: listTransactions
      tags: [Transactions]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
        - name: type
          in: query
          description: Filter by transaction type (credit/debit)
          schema:
            type: string
            enum: [credit, debit]
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Transaction"
                  total:
                    type: integer
                  limit:
                    type: integer
                  skip:
                    type: integer

    post:
      summary: Create a new transaction
      operationId: createTransaction
      tags: [Transactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
            example:
              amount: 150.75
              type: credit
              description: Salary deposit
              account: ACC-1001
              currency: USD
      responses:
        "201":
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          description: Validation error

  /api/transactions/{txnId}:
    get:
      summary: Get a transaction by ID
      operationId: getTransaction
      tags: [Transactions]
      parameters:
        - name: txnId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Transaction details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Transaction not found

    delete:
      summary: Delete a transaction
      operationId: deleteTransaction
      tags: [Transactions]
      parameters:
        - name: txnId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Transaction deleted
        "404":
          description: Transaction not found

  /api/transactions/summary:
    get:
      summary: Get transaction summary (totals by type)
      operationId: transactionSummary
      tags: [Transactions]
      responses:
        "200":
          description: Aggregated summary
          content:
            application/json:
              example:
                credit:
                  total_amount: 5250.00
                  count: 5
                  avg_amount: 1050.00
                debit:
                  total_amount: 2100.00
                  count: 4
                  avg_amount: 525.00

components:
  schemas:
    Transaction:
      type: object
      properties:
        _id:
          type: string
          example: "65a1b2c3d4e5f6a7b8c9d0e1"
        amount:
          type: number
          example: 150.75
        type:
          type: string
          enum: [credit, debit]
          example: credit
        description:
          type: string
          example: Salary deposit
        account:
          type: string
          example: ACC-1001
        currency:
          type: string
          example: USD
        status:
          type: string
          example: completed
        timestamp:
          type: string
          format: date-time
          example: "2026-02-12T10:30:00Z"

    TransactionInput:
      type: object
      required:
        - amount
        - type
        - description
      properties:
        amount:
          type: number
        type:
          type: string
          enum: [credit, debit]
        description:
          type: string
        account:
          type: string
          default: default
        currency:
          type: string
          default: USD
        status:
          type: string
          default: completed
